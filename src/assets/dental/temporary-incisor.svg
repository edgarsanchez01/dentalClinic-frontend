<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44"
  data-family="incisor" data-dentition="TEMPORARY" fill="none">
  <title>Corona de incisivo temporal</title>
  <!-- UX-05L: corona corta, redondeada y bulbosa, con borde incisal suave y cuello muy
       estrecho. Geometria propia, no una version escalada del permanente. Sin estados clinicos. -->
  <defs>
    <path id="ti-crown" data-outline="crown"
      d="M 12.6 8.4
        C 13.1 5.4 14.9 4.0 17.3 4.0
        C 19.1 4.0 20.8 4.8 22.0 5.5
        C 23.2 4.8 24.9 4.0 26.7 4.0
        C 29.1 4.0 30.9 5.4 31.4 8.4
        C 32.5 12.7 32.8 17.9 32.1 22.8
        C 31.4 27.4 30.0 31.0 27.7 33.4
        C 26.2 35.0 24.3 35.8 22.0 35.8
        C 19.7 35.8 17.8 35.0 16.3 33.4
        C 14.0 31.0 12.6 27.4 11.9 22.8
        C 11.2 17.9 11.5 12.7 12.6 8.4 Z"/>
    <clipPath id="ti-clip"><use href="#ti-crown"/></clipPath>
    <linearGradient id="ti-lit" x1="0" y1="0" x2="1" y2=".08">
      <stop offset="0" stop-color="#8f7d64" stop-opacity=".22"/>
      <stop offset=".15" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".36" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset=".58" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".80" stop-color="#a38f75" stop-opacity=".11"/>
      <stop offset="1" stop-color="#7c684f" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="ti-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".40" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".74" stop-color="#a38f75" stop-opacity=".09"/>
      <stop offset="1" stop-color="#6d5d48" stop-opacity=".25"/>
    </linearGradient>
    <radialGradient id="ti-cervical" cx=".5" cy="1.02" r=".70">
      <stop offset="0" stop-color="#6d5d48" stop-opacity=".24"/>
      <stop offset=".55" stop-color="#6d5d48" stop-opacity=".08"/>
      <stop offset="1" stop-color="#6d5d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ti-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g data-layer="geometry">
    <use href="#ti-crown" fill="var(--tooth-fill, #f8f3ea)"/>
  </g>

  <g data-layer="volume" clip-path="url(#ti-clip)">
    <use href="#ti-crown" fill="url(#ti-lit)"/>
    <use href="#ti-crown" fill="url(#ti-depth)"/>
    <use href="#ti-crown" fill="url(#ti-cervical)"/>
    <path d="M 16.4 6.8 C 15.7 10.4 15.6 14.0 16.1 17.6 C 17.2 17.2 18.1 16.4 18.6 15.2 C 18.1 12.6 17.9 10.0 18.1 7.2 Z"
      fill="url(#ti-sheen)"/>
    <path d="M 15.4 5.2 C 17.2 4.5 19.0 4.7 20.8 5.4" fill="none" stroke="#ffffff"
      stroke-opacity=".36" stroke-width=".8" stroke-linecap="round"/>
  </g>

  <g data-layer="detail" clip-path="url(#ti-clip)">
    <path d="M 13.9 7.4 C 16.8 6.6 19.4 6.9 22 7.0 C 24.6 6.9 27.2 6.6 30.1 7.4"
      fill="none" stroke="var(--tooth-groove, #8a7b66)" stroke-opacity=".20" stroke-width=".65"
      stroke-linecap="round"/>
    <path d="M 16.9 32.9 C 18.8 34.1 20.3 34.6 22 34.6 C 23.7 34.6 25.2 34.1 27.1 32.9"
      fill="none" stroke="var(--tooth-groove, #8a7b66)" stroke-opacity=".18" stroke-width=".6"
      stroke-linecap="round"/>
  </g>

  <use href="#ti-crown" fill="none" stroke="var(--tooth-outline, #8a7f6e)" stroke-width=".8"
    stroke-linejoin="round" stroke-linecap="round"/>
</svg>
