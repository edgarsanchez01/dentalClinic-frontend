<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44"
  data-family="premolar" data-dentition="PERMANENT" fill="none">
  <title>Corona de premolar permanente</title>
  <!-- UX-05L: dos cuspides suaves con valle central y cuerpo ovalado. El surco separa las
       cuspides sin convertirse en un simbolo. Sin estados clinicos. -->
  <defs>
    <path id="pp-crown" data-outline="crown"
      d="M 14.2 4.0
        C 16.2 3.2 17.8 3.8 19.0 5.6
        C 19.9 7.2 20.8 8.7 22.0 8.7
        C 23.2 8.7 24.1 7.2 25.0 5.6
        C 26.2 3.8 27.8 3.2 29.8 4.0
        C 32.5 4.9 34.2 7.7 34.8 11.8
        C 35.6 16.6 35.5 22.0 34.7 27.2
        C 34.0 31.9 32.2 35.2 29.3 37.1
        C 27.4 38.3 24.9 38.8 22.0 38.8
        C 19.1 38.8 16.6 38.3 14.7 37.1
        C 11.8 35.2 10.0 31.9 9.3 27.2
        C 8.5 22.0 8.4 16.6 9.2 11.8
        C 9.8 7.7 11.5 4.9 14.2 4.0 Z"/>
    <clipPath id="pp-clip"><use href="#pp-crown"/></clipPath>
    <linearGradient id="pp-lit" x1="0" y1="0" x2="1" y2=".08">
      <stop offset="0" stop-color="#8f7d64" stop-opacity=".22"/>
      <stop offset=".15" stop-color="#ffffff" stop-opacity=".32"/>
      <stop offset=".36" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset=".58" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".80" stop-color="#a38f75" stop-opacity=".11"/>
      <stop offset="1" stop-color="#7c684f" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="pp-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset=".40" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".74" stop-color="#a38f75" stop-opacity=".09"/>
      <stop offset="1" stop-color="#6d5d48" stop-opacity=".24"/>
    </linearGradient>
    <radialGradient id="pp-cervical" cx=".5" cy="1.02" r=".74">
      <stop offset="0" stop-color="#6d5d48" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#6d5d48" stop-opacity=".07"/>
      <stop offset="1" stop-color="#6d5d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pp-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g data-layer="geometry">
    <use href="#pp-crown" fill="var(--tooth-fill, #f8f3ea)"/>
  </g>

  <g data-layer="volume" clip-path="url(#pp-clip)">
    <use href="#pp-crown" fill="url(#pp-lit)"/>
    <use href="#pp-crown" fill="url(#pp-depth)"/>
    <use href="#pp-crown" fill="url(#pp-cervical)"/>
    <path d="M 13.4 6.2 C 12.8 8.8 12.7 11.3 13.1 13.7 C 13.9 13.3 14.6 12.6 15.0 11.7 C 14.5 9.8 14.3 7.9 14.4 6.0 Z"
      fill="url(#pp-sheen)"/>
    <path d="M 29.2 6.7 C 28.7 8.9 28.6 11.1 29.0 13.3 C 29.8 12.9 30.5 12.2 30.9 11.3 C 30.4 9.7 30.2 8.0 30.3 6.5 Z"
      fill="url(#pp-sheen)" opacity=".8"/>
    <path d="M 15.2 4.7 C 16.2 4.2 17.1 4.4 17.9 5.3 M 29.6 4.8 C 30.6 4.3 31.5 4.6 32.2 5.5"
      fill="none" stroke="#ffffff" stroke-opacity=".36" stroke-width=".75" stroke-linecap="round"/>
  </g>

  <g data-layer="detail" clip-path="url(#pp-clip)">
    <path d="M 22.0 9.6 C 22.3 11.6 21.8 13.4 22.1 15.4 C 22.3 16.6 22.2 17.6 22.0 18.6"
      fill="none" stroke="var(--tooth-groove, #8a7b66)" stroke-opacity=".30" stroke-width=".7"
      stroke-linecap="round"/>
    <path d="M 20.2 11.4 C 18.6 10.0 17.6 8.5 17.0 7.0 M 23.8 11.4 C 25.4 10.0 26.4 8.5 27.0 7.0"
      fill="none" stroke="var(--tooth-groove, #8a7b66)" stroke-opacity=".13" stroke-width=".55"
      stroke-linecap="round"/>
    <path d="M 15.8 34.9 C 18.2 36.2 20.1 36.7 22 36.7 C 23.9 36.7 25.8 36.2 28.2 34.9"
      fill="none" stroke="var(--tooth-groove, #8a7b66)" stroke-opacity=".18" stroke-width=".6"
      stroke-linecap="round"/>
  </g>

  <use href="#pp-crown" fill="none" stroke="var(--tooth-outline, #8a7f6e)" stroke-width=".8"
    stroke-linejoin="round" stroke-linecap="round"/>
</svg>
