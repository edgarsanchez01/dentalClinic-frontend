<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44"
  data-family="canine" data-dentition="TEMPORARY" fill="none">
  <title>Corona de canino temporal</title>
  <!-- UX-05L: cuspide corta y roma sobre un cuerpo redondeado y bulboso. Perfil propio,
       mas bajo y menos afilado que el canino permanente. Sin estados clinicos. -->
  <defs>
    <path id="tc-crown" data-outline="crown"
      d="M 20.3 5.4
        C 21.0 4.5 22.1 4.6 23.0 5.7
        C 24.4 7.5 26.4 9.4 28.4 10.6
        C 29.5 11.3 30.2 12.5 30.5 14.2
        C 31.2 17.9 31.6 21.6 31.3 25.2
        C 31.0 29.1 29.3 31.9 27.0 33.8
        C 25.6 35.0 23.8 35.6 22.0 35.6
        C 20.2 35.6 18.4 35.0 17.0 33.8
        C 14.7 31.9 13.0 29.1 12.7 25.2
        C 12.4 21.6 12.9 17.9 13.4 14.4
        C 13.7 12.7 14.3 11.5 15.5 10.8
        C 17.5 9.7 18.9 7.4 20.3 5.4 Z"/>
    <clipPath id="tc-clip"><use href="#tc-crown"/></clipPath>
    <linearGradient id="tc-lit" x1="0" y1="0" x2="1" y2=".08">
      <stop offset="0" stop-color="#8f7d64" stop-opacity=".22"/>
      <stop offset=".16" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".36" stop-color="#ffffff" stop-opacity=".06"/>
      <stop offset=".58" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".80" stop-color="#a38f75" stop-opacity=".11"/>
      <stop offset="1" stop-color="#7c684f" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="tc-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".40" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".74" stop-color="#a38f75" stop-opacity=".09"/>
      <stop offset="1" stop-color="#6d5d48" stop-opacity=".25"/>
    </linearGradient>
    <radialGradient id="tc-cervical" cx=".5" cy="1.02" r=".70">
      <stop offset="0" stop-color="#6d5d48" stop-opacity=".24"/>
      <stop offset=".55" stop-color="#6d5d48" stop-opacity=".08"/>
      <stop offset="1" stop-color="#6d5d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tc-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g data-layer="geometry">
    <use href="#tc-crown" fill="var(--tooth-fill, #f8f3ea)"/>
  </g>

  <g data-layer="volume" clip-path="url(#tc-clip)">
    <use href="#tc-crown" fill="url(#tc-lit)"/>
    <use href="#tc-crown" fill="url(#tc-depth)"/>
    <use href="#tc-crown" fill="url(#tc-cervical)"/>
    <path d="M 16.9 10.6 C 16.3 14.2 16.2 17.8 16.6 21.4 C 17.5 21.0 18.3 20.2 18.8 19.0 C 18.3 16.2 18.1 13.4 18.3 10.8 Z"
      fill="url(#tc-sheen)"/>
    <path d="M 20.8 5.4 C 21.4 5.1 22.6 5.1 23.2 5.4 M 21.2 6.2 C 22.0 6.8 22.8 7.6 23.4 8.4"
      fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width=".75" stroke-linecap="round"/>
  </g>

  <g data-layer="detail" clip-path="url(#tc-clip)">
    <path d="M 21.7 8.6 C 21.5 12.4 21.4 16.2 21.6 19.8" fill="none"
      stroke="var(--tooth-groove, #8a7b66)" stroke-opacity=".15" stroke-width=".6"
      stroke-linecap="round"/>
    <path d="M 15.7 32.5 C 17.8 33.9 19.8 34.4 22 34.4 C 24.2 34.4 26.2 33.9 28.3 32.5"
      fill="none" stroke="var(--tooth-groove, #8a7b66)" stroke-opacity=".18" stroke-width=".6"
      stroke-linecap="round"/>
  </g>

  <use href="#tc-crown" fill="none" stroke="var(--tooth-outline, #8a7f6e)" stroke-width=".8"
    stroke-linejoin="round" stroke-linecap="round"/>
</svg>
