<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44"
  data-family="canine" data-dentition="PERMANENT" fill="none">
  <title>Corona de canino permanente</title>
  <!-- UX-05L: cuspide unica con vertice ligeramente mesial, hombros asimetricos y cuerpo
       ancho que se estrecha en el cuello. Sin estados clinicos. -->
  <defs>
    <path id="pc-crown" data-outline="crown"
      d="M 20.4 3.2
        C 20.8 2.5 21.5 2.4 22.0 2.9
        C 23.6 5.0 25.3 7.1 27.4 8.5
        C 28.7 9.5 30.4 10.3 31.4 12.1
        C 32.8 15.4 33.1 21.4 33.3 26.5
        C 33.5 30.7 31.9 34.0 29.4 36.2
        C 27.8 37.5 25.2 38.2 22.0 38.2
        C 18.8 38.2 16.2 37.5 14.6 36.2
        C 12.1 34.0 10.5 30.7 10.7 26.5
        C 10.9 22.1 11.1 16.3 12.1 13.0
        C 12.6 11.2 14.2 10.3 15.7 9.5
        C 17.7 7.8 19.0 5.2 20.4 3.2 Z"/>
    <clipPath id="pc-clip"><use href="#pc-crown"/></clipPath>
    <linearGradient id="pc-lit" x1="0" y1="0" x2="1" y2=".08">
      <stop offset="0" stop-color="#8f7d64" stop-opacity=".22"/>
      <stop offset=".15" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".36" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset=".58" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".80" stop-color="#a38f75" stop-opacity=".11"/>
      <stop offset="1" stop-color="#7c684f" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="pc-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset=".38" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".74" stop-color="#a38f75" stop-opacity=".09"/>
      <stop offset="1" stop-color="#6d5d48" stop-opacity=".24"/>
    </linearGradient>
    <radialGradient id="pc-cervical" cx=".5" cy="1.02" r=".72">
      <stop offset="0" stop-color="#6d5d48" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#6d5d48" stop-opacity=".07"/>
      <stop offset="1" stop-color="#6d5d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pc-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g data-layer="geometry">
    <use href="#pc-crown" fill="var(--tooth-fill, #f8f3ea)"/>
  </g>

  <g data-layer="volume" clip-path="url(#pc-clip)">
    <use href="#pc-crown" fill="url(#pc-lit)"/>
    <use href="#pc-crown" fill="url(#pc-depth)"/>
    <use href="#pc-crown" fill="url(#pc-cervical)"/>
    <path d="M 16.7 8.4 C 16.1 12.4 16.0 16.6 16.4 20.8 C 17.3 20.4 18.1 19.6 18.6 18.4 C 18.1 15.1 17.9 11.9 18.1 8.8 Z"
      fill="url(#pc-sheen)"/>
    <path d="M 20.8 3.4 C 21.4 3.9 22.9 5.7 23.9 7.2" fill="none" stroke="#ffffff"
      stroke-opacity=".38" stroke-width=".8" stroke-linecap="round"/>
  </g>

  <g data-layer="detail" clip-path="url(#pc-clip)">
    <path d="M 20.9 7.2 C 20.6 11.2 20.5 15.2 20.7 19.2" fill="none"
      stroke="var(--tooth-groove, #8a7b66)" stroke-opacity=".15" stroke-width=".6"
      stroke-linecap="round"/>
    <path d="M 15.2 33.8 C 17.6 35.2 19.8 35.8 22 35.8 C 24.2 35.8 26.4 35.2 28.8 33.8"
      fill="none" stroke="var(--tooth-groove, #8a7b66)" stroke-opacity=".18" stroke-width=".6"
      stroke-linecap="round"/>
  </g>

  <use href="#pc-crown" fill="none" stroke="var(--tooth-outline, #8a7f6e)" stroke-width=".8"
    stroke-linejoin="round" stroke-linecap="round"/>
</svg>
