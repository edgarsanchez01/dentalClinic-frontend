<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" width="44" height="44"
  data-family="molar" data-dentition="PERMANENT" fill="none">
  <title>Corona de molar permanente</title>
  <!-- UX-05L: cuatro cuspides redondeadas, corona voluminosa y surcos en Y. La masa y el
       numero de lobulos la distinguen del premolar. Sin estados clinicos. -->
  <defs>
    <path id="pm-crown" data-outline="crown"
      d="M 8.0 12.4
        C 7.5 8.4 8.9 5.6 11.7 5.1
        C 13.4 4.8 14.6 6.0 15.6 6.6
        C 16.3 7.0 17.0 4.7 19.2 4.7
        C 21.3 4.7 22.0 6.6 23.4 6.8
        C 24.6 7.0 25.1 5.4 27.1 5.6
        C 28.5 5.5 29.8 7.5 30.8 7.4
        C 31.8 7.2 32.3 6.2 33.4 6.4
        C 35.2 6.7 35.8 8.4 36.0 12.2
        C 36.9 17.4 36.8 23.2 35.7 28.4
        C 34.6 33.4 31.9 36.6 27.4 38.4
        C 25.7 39.1 23.8 39.3 22.0 39.3
        C 20.2 39.3 18.3 39.1 16.6 38.4
        C 12.1 36.6 9.4 33.4 8.3 28.4
        C 7.2 23.2 7.1 17.4 8.0 12.2 Z"/>
    <clipPath id="pm-clip"><use href="#pm-crown"/></clipPath>
    <linearGradient id="pm-lit" x1="0" y1="0" x2="1" y2=".08">
      <stop offset="0" stop-color="#8f7d64" stop-opacity=".22"/>
      <stop offset=".14" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".05"/>
      <stop offset=".58" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".80" stop-color="#a38f75" stop-opacity=".11"/>
      <stop offset="1" stop-color="#7c684f" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="pm-depth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".24"/>
      <stop offset=".38" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".74" stop-color="#a38f75" stop-opacity=".09"/>
      <stop offset="1" stop-color="#6d5d48" stop-opacity=".26"/>
    </linearGradient>
    <radialGradient id="pm-cervical" cx=".5" cy="1.02" r=".74">
      <stop offset="0" stop-color="#6d5d48" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#6d5d48" stop-opacity=".07"/>
      <stop offset="1" stop-color="#6d5d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pm-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g data-layer="geometry">
    <use href="#pm-crown" fill="var(--tooth-fill, #f8f3ea)"/>
  </g>

  <g data-layer="volume" clip-path="url(#pm-clip)">
    <use href="#pm-crown" fill="url(#pm-lit)"/>
    <use href="#pm-crown" fill="url(#pm-depth)"/>
    <use href="#pm-crown" fill="url(#pm-cervical)"/>
    <path d="M 12.4 6.6 C 11.7 9.8 11.6 13.2 12.1 16.6 C 13.1 16.2 13.9 15.4 14.4 14.2 C 13.9 11.7 13.7 9.2 13.9 6.4 Z"
      fill="url(#pm-sheen)"/>
    <path d="M 28.4 6.4 C 27.9 8.6 27.8 10.8 28.2 13.0 C 29.0 12.6 29.7 11.9 30.1 11.0 C 29.6 9.4 29.4 7.7 29.5 6.2 Z"
      fill="url(#pm-sheen)" opacity=".7"/>
    <path d="M 10.3 7.5 C 12.0 6.2 13.6 6.6 14.5 7.7 M 17.2 7.3 C 18.9 5.7 20.6 6.4 21.8 8.2 M 25.5 8.0 C 27.2 6.9 28.4 8.1 29.1 9.2"
      fill="none" stroke="#ffffff" stroke-opacity=".42" stroke-width=".85" stroke-linecap="round"/>
  </g>

  <g data-layer="detail" clip-path="url(#pm-clip)">
    <path d="M 23.3 8.4 C 23.0 10.8 21.9 13.0 22.0 15.6 C 22.2 17.4 21.9 19.0 22.0 20.4"
      fill="none" stroke="var(--tooth-groove, #8a7b66)" stroke-opacity=".28" stroke-width=".7"
      stroke-linecap="round"/>
    <path d="M 22.1 13.8 C 19.7 12.6 17.4 10.8 15.9 8.7 M 22.0 15.0 C 25.1 13.7 27.8 11.4 29.7 9.4"
      fill="none" stroke="var(--tooth-groove, #8a7b66)" stroke-opacity=".21" stroke-width=".6"
      stroke-linecap="round"/>
    <path d="M 15.4 35.2 C 17.9 36.6 20.0 37.2 22 37.2 C 24.0 37.2 26.1 36.6 28.6 35.2"
      fill="none" stroke="var(--tooth-groove, #8a7b66)" stroke-opacity=".18" stroke-width=".6"
      stroke-linecap="round"/>
  </g>

  <use href="#pm-crown" fill="none" stroke="var(--tooth-outline, #8a7f6e)" stroke-width=".8"
    stroke-linejoin="round" stroke-linecap="round"/>
</svg>
